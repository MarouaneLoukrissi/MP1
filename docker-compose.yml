version: "3.9"

services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  finance-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance-app
    ports:
      - "8081:8080"
    depends_on:
      - jenkins
    restart: unless-stopped

volumes:
  jenkins_home:
